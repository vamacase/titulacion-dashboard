<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Titulación</title>
<style>
  :root { --bg:#f4f5f7; --barra:#1f2a44; --texto:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171f; --barra:#0d1018; } }
  html, body { height:100%; margin:0; background:var(--bg); font-family:Cambria, Georgia, serif; }
  .barra { display:flex; align-items:center; gap:.75rem; padding:.5rem 1rem; background:var(--barra); color:var(--texto); }
  .barra label { font-size:.95rem; }
  .barra select { font:inherit; padding:.25rem .5rem; border-radius:6px; border:0; }
  iframe { display:block; width:100%; height:calc(100% - 3rem); border:0; }
</style>
</head>
<body>
<div class="barra">
  <label for="periodo">Periodo de titulación:</label>
  <select id="periodo"></select>
</div>
<iframe id="vista" title="Dashboard de titulación"></iframe>
<noscript><p><a href="dashboard-2026-2027-ti2.html">Abrir el dashboard del periodo actual</a></p></noscript>
<script>
const PERIODOS = [{"id": "2026-2027-ti2", "etiqueta": "2026 - 2027 TI2", "archivo": "dashboard-2026-2027-ti2.html"}, {"id": "2026-2027-ti1", "etiqueta": "2026 - 2027 TI1", "archivo": "dashboard-2026-2027-ti1.html"}];
const ACTUAL = "2026-2027-ti2";
const sel = document.getElementById("periodo");
const vista = document.getElementById("vista");
PERIODOS.forEach(p => {
  const o = document.createElement("option");
  o.value = p.id; o.textContent = p.etiqueta + (p.id === ACTUAL ? " (actual)" : "");
  sel.appendChild(o);
});
function mostrar(id) {
  const p = PERIODOS.find(x => x.id === id) || PERIODOS.find(x => x.id === ACTUAL);
  sel.value = p.id; vista.src = p.archivo;
  try { const u = new URL(location); u.searchParams.set("periodo", p.id); history.replaceState(null, "", u); } catch (e) {}
}
sel.addEventListener("change", () => mostrar(sel.value));
mostrar(new URLSearchParams(location.search).get("periodo") || ACTUAL);
</script>
</body>
</html>
